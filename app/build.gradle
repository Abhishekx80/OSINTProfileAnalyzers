plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'com.example.osintprofileanalyzer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.osintprofileanalyzer'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
